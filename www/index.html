<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Время">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1a14">
  <title>Учёт времени</title>
  <script src="xlsx.full.min.js"></script>
  <style>
    :root{
      --bg:#f3f5f2;--card:#fff;--ink:#16211b;--mute:#6b7a70;--line:#dfe5e0;
      --go:#1f7a4d;--go2:#2fa36a;--acc:#e0a526;--stop:#c23b2e;
      padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        --bg:#0f1511;--card:#18211c;--ink:#e7efe9;--mute:#8c9b92;--line:#27332b;
        --go:#3fb57a;--go2:#34a36b;--acc:#e0a526;--stop:#e5675a;
      }
    }
    :root[data-theme="dark"]{
      --bg:#0f1511;--card:#18211c;--ink:#e7efe9;--mute:#8c9b92;--line:#27332b;
      --go:#3fb57a;--go2:#34a36b;--acc:#e0a526;--stop:#e5675a;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0}
    body{
      background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--go) 14%,var(--bg)),var(--bg) 70%) fixed;
      color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
      overscroll-behavior:none;user-select:none;-webkit-user-select:none
    }
    #app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
    header{padding:14px 20px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center}
    header h1::before{content:"⏱";display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border-radius:9px;background:var(--go);font-size:16px;color:#fff}
    .header-right{display:flex;align-items:center;gap:6px}
    #sync{font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
    .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:15px;cursor:pointer}
    .screen{flex:1;overflow-y:auto;padding:12px 20px}
    .screen[hidden]{display:none}

    /* Timer */
    #t-screen{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;text-align:center}
    #clock{font-size:clamp(48px,16vw,74px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
    #since{color:var(--mute);font-size:13px;min-height:1.3em}
    .ringwrap{position:relative;width:min(72vw,275px);aspect-ratio:1;margin-top:6px;display:grid;place-items:center}
    .ringwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
    .trk{fill:none;stroke:var(--line);stroke-width:9}
    .arc{fill:none;stroke-width:9;stroke-dasharray:0 100;transition:stroke-dasharray .5s ease,stroke-dashoffset .5s ease}
    .shine{fill:none;stroke:#fff;stroke-width:9;stroke-opacity:.55;stroke-dasharray:3 97;stroke-linecap:round;opacity:0}
    #spin{transform-origin:100px 100px}
    .running #spin{animation:spin 2.4s linear infinite}
    .running .shine{opacity:1}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sw{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:2;stroke-dasharray:0 100;stroke-linecap:round}
    #toggle{
      position:relative;z-index:2;width:60%;aspect-ratio:1;border-radius:50%;border:0;
      background:linear-gradient(160deg,var(--go2),var(--go));color:#fff;font:inherit;font-size:25px;font-weight:800;
      box-shadow:0 10px 30px color-mix(in srgb,var(--go) 40%,transparent),0 0 0 10px color-mix(in srgb,var(--go) 14%,transparent);
      transition:transform .12s,background .2s,box-shadow .2s;cursor:pointer
    }
    #toggle:active{transform:scale(.95)}
    #toggle.run{
      background:linear-gradient(160deg,color-mix(in srgb,var(--stop) 85%,#fff),var(--stop));
      box-shadow:0 10px 30px color-mix(in srgb,var(--stop) 40%,transparent),0 0 0 10px color-mix(in srgb,var(--stop) 14%,transparent)
    }
    .running #toggle{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    .running #toggle:active{animation:none;transform:scale(.95)}
    @media (prefers-reduced-motion:reduce){.running #spin,.running #toggle{animation:none}}
    .legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:2px;flex-wrap:wrap;justify-content:center}
    .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
    .start{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 8px 5px 12px}
    #st{font:inherit;font-size:17px;font-weight:700;color:var(--ink);border:0;background:transparent;padding:4px 4px}
    #clr{border:0;background:none;color:var(--mute);font-size:18px;padding:3px 6px;cursor:pointer}
    #today{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
    #today b{color:var(--ink)}
    #bl{font-size:11px;margin-top:5px}

    /* History */
    .sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;color:var(--mute);margin-bottom:10px;font-size:14px}
    .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    .filters .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
    .filters .chip.on{background:color-mix(in srgb,var(--go) 14%,transparent);color:var(--go);border-color:color-mix(in srgb,var(--go) 35%,var(--line))}
    .filters .range{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--mute);font-size:12px}
    .filters .range input{font:inherit;font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
    .month-sum{background:color-mix(in srgb,var(--go) 8%,var(--card));border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--mute)}
    .month-sum b{color:var(--ink)}
    .month-sum .mbar{height:7px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
    .month-sum .mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--go2),var(--acc));transition:width .4s}

    .wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
    table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
    th,td{padding:10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
    thead th{background:color-mix(in srgb,var(--go) 9%,var(--card));color:var(--mute);font-weight:600;font-size:12px;position:sticky;top:0}
    tbody tr:nth-child(even){background:color-mix(in srgb,var(--ink) 3%,transparent)}
    tr:last-child td{border-bottom:0}
    td.c100{font-weight:800}
    td.c125{color:var(--acc)}
    td.c150{color:var(--stop)}
    tfoot td{font-weight:800;background:color-mix(in srgb,var(--go) 12%,var(--card));border-top:2px solid var(--go);border-bottom:0;position:sticky;bottom:0}
    .row-btns{display:flex;gap:2px}
    .row-btns button{border:0;background:none;color:var(--mute);font-size:16px;padding:2px 4px;cursor:pointer}
    .row-btns button.del:hover{color:var(--stop)}
    .row-btns button.edit:hover{color:var(--go)}
    .empty{padding:40px 10px;text-align:center;color:var(--mute)}

    /* Heatmap */
    .heat-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
    .heat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mute);gap:6px;flex-wrap:wrap}
    .heat-title{font-weight:700;color:var(--ink);font-size:14px}
    .heat-range{font-size:11px;color:var(--mute)}
    .heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
    .heat-cell{width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--line) 100%,transparent);cursor:pointer;transition:transform .1s}
    .heat-cell:active{transform:scale(.85)}
    .heat-cell.h0{background:color-mix(in srgb,var(--line) 100%,transparent)}
    .heat-cell.h1{background:color-mix(in srgb,var(--go2) 30%,var(--line))}
    .heat-cell.h2{background:color-mix(in srgb,var(--go2) 60%,var(--line))}
    .heat-cell.h3{background:var(--go2)}
    .heat-cell.h4{background:var(--acc)}
    .heat-cell.h5{background:var(--stop)}
    .heat-cell.today{outline:2px solid var(--ink);outline-offset:1px}
    .heat-legend{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--mute);margin-top:10px;flex-wrap:wrap}
    .heat-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
    .heat-hint{font-size:11px;color:var(--mute);margin-top:6px;font-style:italic}

    /* Actions */
    .hist-actions{margin-top:14px;display:flex;flex-direction:column;gap:8px}
    .hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .hist-act-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:7px;
      padding:12px 14px;border:1px solid var(--line);border-radius:14px;
      background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;
      cursor:pointer;transition:transform .1s,background .15s;box-shadow:0 2px 8px rgba(0,0,0,.04)
    }
    .hist-act-btn:active{transform:scale(.97)}
    .hist-act-btn.primary{background:var(--go);color:#fff;border-color:var(--go)}
    .hist-clear-btn{border:0;background:none;color:var(--mute);text-decoration:underline;font:inherit;font-size:14px;margin:6px auto 10px;display:block;cursor:pointer}

    .export-opt-btn{
      display:flex;align-items:center;gap:12px;padding:12px 14px;
      background:var(--bg);border:1px solid var(--line);border-radius:14px;
      font:inherit;cursor:pointer;transition:background .15s;width:100%
    }
    .export-opt-btn:active{background:color-mix(in srgb,var(--go) 10%,var(--bg))}

    /* Manual */
    .form{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
    .form label{display:grid;gap:5px;color:var(--mute);font-size:13px;font-weight:600}
    .form input{font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    #pv{background:color-mix(in srgb,var(--go) 10%,var(--card));border-radius:12px;padding:12px;font-size:14px;color:var(--mute);min-height:60px}
    #pv b{color:var(--ink);font-size:19px}
    #add{border:0;border-radius:14px;padding:15px;background:var(--go);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
    #add:disabled{opacity:.4}

    /* Modals */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
      z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease-out
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .modal-overlay[hidden]{display:none}
    .modal-card{
      background:var(--card);border:1px solid var(--line);border-radius:20px;
      max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto
    }
    .modal-head{display:flex;align-items:center;justify-content:space-between}
    .modal-head h3{margin:0;font-size:18px;font-weight:800}
    .modal-close{border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer;padding:4px}
    .modal-field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
    .modal-field input,.modal-field select{
      font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);
      border:1px solid var(--line);border-radius:10px;padding:10px;width:100%
    }
    .modal-btns{display:flex;gap:10px;margin-top:6px}
    .modal-btn-save{flex:1;border:0;background:var(--go);color:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
    .modal-btn-cancel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}

    .radio-row{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
    .radio-row input{accent-color:var(--go);width:18px;height:18px}

    /* Nav */
    nav{margin:0 12px 8px;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;background:var(--card);z-index:10}
    nav button{
      flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:700;
      padding:9px 0 7px;margin:5px;border-radius:15px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer
    }
    nav button .i{font-size:19px;line-height:1}
    nav button.on{color:var(--go);background:color-mix(in srgb,var(--go) 14%,transparent)}
    button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Учёт времени</h1>
    <div class="header-right">
      <button class="icon-btn" id="btn-settings" title="Настройки">⚙️</button>
      <span id="sync"></span>
    </div>
  </header>

  <!-- Timer Screen -->
  <section class="screen" id="t-screen">
    <div id="clock">00:00:00</div>
    <div id="since"></div>
    <div class="ringwrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="trk" cx="100" cy="100" r="90" pathLength="100"/>
        <circle class="trk" cx="100" cy="100" r="77" pathLength="100"/>
        <circle id="rg" class="arc" cx="100" cy="100" r="90" pathLength="100" stroke="var(--go2)"/>
        <circle id="ry" class="arc" cx="100" cy="100" r="90" pathLength="100" stroke="var(--acc)"/>
        <circle id="rr" class="arc" cx="100" cy="100" r="77" pathLength="100" stroke="var(--stop)"/>
        <g id="spin"><circle class="shine" cx="100" cy="100" r="90" pathLength="100"/></g>
        <circle id="sw" class="sw" cx="100" cy="100" r="98" pathLength="100"/>
        <circle id="dot" cx="198" cy="100" r="3.6" fill="var(--ink)" opacity="0"/>
      </svg>
      <button id="toggle">Старт</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="start"><label for="st" id="stl">Начать с</label><input type="time" id="st"><button id="clr" aria-label="Сбросить время" hidden>×</button></div>
    <div id="today"></div>
  </section>

  <!-- History Screen -->
  <section class="screen" id="h-screen" hidden>
    <div class="filters">
      <button class="chip" data-range="today">Сегодня</button>
      <button class="chip" data-range="month">Месяц</button>
      <button class="chip on" data-range="all">Всё</button>
      <div class="range">
        <input type="date" id="flt-from">
        <span>—</span>
        <input type="date" id="flt-to">
      </div>
    </div>
    <div class="month-sum" id="month-sum"></div>
    <div class="sum"><span id="cnt"></span><span id="total"></span></div>
    <div class="wrap"><table id="tbl"><thead><tr><th>№</th><th>Число</th><th>Начало</th><th>Конец</th><th>100%</th><th>125%</th><th>150%</th><th></th></tr></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div>
    <div id="empty" class="empty"></div>

    <div class="heat-wrap">
      <div class="heat-head">
        <div>
          <div class="heat-title">🔥 Активность по дням</div>
          <div class="heat-range" id="heat-range"></div>
        </div>
        <div class="heat-range">26 недель</div>
      </div>
      <div class="heat-grid" id="heat-grid"></div>
      <div class="heat-legend">
        <span><i class="heat-cell h0"></i>нет</span>
        <span><i class="heat-cell h1"></i>мало</span>
        <span><i class="heat-cell h2"></i>полдня</span>
        <span><i class="heat-cell h3"></i>норма</span>
        <span><i class="heat-cell h4"></i>переработка</span>
        <span><i class="heat-cell h5"></i>много</span>
      </div>
      <div class="heat-hint">Коснитесь ячейки, чтобы увидеть записи этого дня.</div>
    </div>

    <div class="hist-actions">
      <div class="hist-grid">
        <button id="btn-export" class="hist-act-btn primary">📤 Экспорт</button>
        <button id="btn-import" class="hist-act-btn">📥 Импорт</button>
      </div>
      <button id="clear" class="hist-clear-btn" hidden>Очистить всё</button>
      <input type="file" id="file-import" accept=".xlsx,.xls,.json" style="display:none">
    </div>
  </section>

  <!-- Manual Screen -->
  <section class="screen" id="m-screen" hidden>
    <div class="form">
      <label>Число<input type="date" id="md"></label>
      <div class="row2"><label>Начало<input type="time" id="ms"></label><label>Конец<input type="time" id="me"></label></div>
      <div id="pv">Введите начало и конец</div>
      <button id="add" disabled>Добавить запись</button>
    </div>
  </section>

  <!-- Bottom Nav -->
  <nav>
    <button id="n-t" class="on"><span class="i">⏱</span>Таймер</button>
    <button id="n-h"><span class="i">☰</span>История</button>
    <button id="n-m"><span class="i">✎</span>Вручную</button>
  </nav>

  <!-- Modal: Settings -->
  <div class="modal-overlay" id="settings-modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Настройки</h3>
        <button class="modal-close" id="settings-close">×</button>
      </div>
      <label class="modal-field">
        Норма дня, ч (100%)
        <input type="number" id="cfg-daily" step="0.25" min="0" max="24">
      </label>
      <label class="modal-field">
        Норма месяца, ч
        <input type="number" id="cfg-monthly" step="1" min="0" max="1000">
      </label>
      <div class="modal-btns">
        <button class="modal-btn-cancel" id="settings-cancel">Отмена</button>
        <button class="modal-btn-save" id="settings-save">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Modal: Edit -->
  <div class="modal-overlay" id="edit-modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Редактирование</h3>
        <button class="modal-close" id="edit-close">×</button>
      </div>
      <label class="modal-field">
        Число
        <input type="date" id="ed-date">
      </label>
      <div class="row2">
        <label class="modal-field">Начало<input type="time" id="ed-start"></label>
        <label class="modal-field">Конец<input type="time" id="ed-end"></label>
      </div>
      <div class="modal-btns">
        <button class="modal-btn-cancel" id="edit-cancel">Отмена</button>
        <button class="modal-btn-save" id="edit-save">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Modal: Export -->
  <div class="modal-overlay" id="export-modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Экспорт</h3>
        <button class="modal-close" id="export-close">×</button>
      </div>
      <div style="font-size:13px;color:var(--mute);line-height:1.4">Что выгрузить:</div>
      <label class="radio-row"><input type="radio" name="exp-range" value="all" checked><div><div>Всё</div><div style="font-size:11px;color:var(--mute);font-weight:400">Все записи</div></div></label>
      <label class="radio-row"><input type="radio" name="exp-range" value="month"><div><div>Месяц</div><div style="font-size:11px;color:var(--mute);font-weight:400">Выбрать месяц из списка</div></div></label>
      <label class="modal-field" id="exp-month-wrap" hidden>
        Месяц
        <select id="exp-month"></select>
      </label>
      <div style="font-size:13px;color:var(--mute);line-height:1.4;margin-top:4px">Формат:</div>
      <div style="display:grid;gap:10px">
        <button id="export-xlsx-btn" class="export-opt-btn" type="button">
          <span style="font-size:24px">📊</span>
          <div style="text-align:left">
            <div style="font-weight:700;color:var(--ink);font-size:14px">Excel (.xlsx)</div>
            <div style="font-size:12px;color:var(--mute)">С цветными заголовками и итогами</div>
          </div>
        </button>
        <button id="export-json-btn" class="export-opt-btn" type="button">
          <span style="font-size:24px">💾</span>
          <div style="text-align:left">
            <div style="font-weight:700;color:var(--ink);font-size:14px">Резервная копия (.json)</div>
            <div style="font-size:12px;color:var(--mute)">Точная копия базы</div>
          </div>
        </button>
        <button id="export-csv-btn" class="export-opt-btn" type="button">
          <span style="font-size:24px">📋</span>
          <div style="text-align:left">
            <div style="font-weight:700;color:var(--ink);font-size:14px">Скопировать CSV в буфер</div>
            <div style="font-size:12px;color:var(--mute)">Вставь в Google Таблицы (Ctrl+V)</div>
          </div>
        </button>
      </div>
      <div class="modal-btns">
        <button class="modal-btn-cancel" id="export-cancel" style="width:100%">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Modal: Import -->
  <div class="modal-overlay" id="import-modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Импорт</h3>
        <button class="modal-close" id="import-close">×</button>
      </div>
      <div id="import-summary" style="background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6"></div>
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-top:2px">Режим импорта:</div>
      <label class="radio-row">
        <input type="radio" name="import-mode" value="merge" checked>
        <div><div>Объединить с текущими</div><div style="font-size:11px;color:var(--mute);font-weight:400">Дубликаты по времени начала будут пропущены</div></div>
      </label>
      <label class="radio-row">
        <input type="radio" name="import-mode" value="replace">
        <div><div>Заменить всю историю</div><div style="font-size:11px;color:var(--mute);font-weight:400">Старые записи удалятся</div></div>
      </label>
      <div class="modal-btns">
        <button class="modal-btn-cancel" id="import-cancel">Отмена</button>
        <button class="modal-btn-save" id="import-apply">Загрузить</button>
      </div>
    </div>
  </div>

</div>

<script>
  /* ============================== CONSTANTS ============================== */
  const KEY_LOG = "timeTracker.v1";
  const KEY_SETTINGS = "timeTracker.settings.v1";
  const KEY_BACKUP = "timeTracker.backup.v1";

  const DEFAULT_SETTINGS = {
    dailyNorm: 8.5,
    monthlyNorm: 182
  };
  let settings = { ...DEFAULT_SETTINGS };

  let log = [];
  let startTs = null;
  let tick = null;
  let ref = null;
  let lastJson = "";
  let pendingImport = [];

  let filter = { kind: "all", from: null, to: null };

  /* ============================== HELPERS ============================== */
  const $ = id => document.getElementById(id);
  const p2 = n => String(n).padStart(2, "0");
  const dur = ms => {
    const s = Math.floor(ms / 1000);
    return p2(Math.floor(s / 3600)) + ":" + p2(Math.floor(s % 3600 / 60)) + ":" + p2(s % 60);
  };
  const durHours = ms => (ms / 3600000).toFixed(2) + " ч";
  const dt = ts => { const d = new Date(ts); return p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear(); };
  const tm = ts => { const d = new Date(ts); return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds()); };
  const tmv = ts => { const d = new Date(ts); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(30); } catch (e) { } };
  const dayKey = ts => dt(ts);

  const HOUR = 3600000;
  function normMs() { return settings.dailyNorm * HOUR; }
  function norm125Ms() { return (settings.dailyNorm + 2) * HOUR; }

  const MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь",
    "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

  /* ============================== SETTINGS ============================== */
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY_SETTINGS) || "{}");
      settings = {
        dailyNorm: parseFloat(s.dailyNorm) > 0 ? parseFloat(s.dailyNorm) : DEFAULT_SETTINGS.dailyNorm,
        monthlyNorm: parseFloat(s.monthlyNorm) > 0 ? parseFloat(s.monthlyNorm) : DEFAULT_SETTINGS.monthlyNorm
      };
    } catch (e) { settings = { ...DEFAULT_SETTINGS }; }
    applySettingsUI();
  }
  function saveSettings() {
    try { localStorage.setItem(KEY_SETTINGS, JSON.stringify(settings)); } catch (e) { }
    applySettingsUI();
  }
  function applySettingsUI() {
    const T1 = settings.dailyNorm;
    const T2 = settings.dailyNorm + 2;
    $("legend").innerHTML =
            `<span><i style="background:var(--go2)"></i>до ${T1.toFixed(2)} ч</span>` +
            `<span><i style="background:var(--acc)"></i>${T1.toFixed(2)}–${T2.toFixed(2)} ч (125%)</span>` +
            `<span><i style="background:var(--stop)"></i>свыше ${T2.toFixed(2)} ч (150%)</span>`;
  }

  /* ============================== CALC ============================== */
  function calc() {
    const out = {}, acc = {};
    const T1 = normMs(), T2 = norm125Ms();
    log.slice().sort((a, b) => a.start - b.start).forEach(r => {
      const k = dayKey(r.start), d = r.end - r.start;
      const before = acc[k] || 0, after = before + d;
      const a = Math.max(0, Math.min(after, T1) - Math.min(before, T1));
      const b = Math.max(0, Math.min(after, T2) - Math.max(before, T1));
      const c = d - a - b;
      out[r.id] = { d, a, b, c };
      acc[k] = after;
    });
    return out;
  }
  const z = v => v > 0 ? dur(v) : "–";

  /* ============================== RING ============================== */
  function ring(cur) {
    const T1 = normMs(), T2 = norm125Ms();
    const g = Math.min(cur, T1) / T2 * 100;
    const y = Math.max(0, Math.min(cur, T2) - T1) / T2 * 100;
    const r = Math.min(1, Math.max(0, cur - T2) / (3 * HOUR)) * 100;
    $("rg").style.strokeDasharray = g + " " + (100 - g);
    $("ry").style.strokeDasharray = y + " " + (100 - y);
    $("ry").style.strokeDashoffset = -(T1 / T2 * 100);
    $("rr").style.strokeDasharray = r + " " + (100 - r);
  }

  /* ============================== STORAGE ============================== */
  let tsumLog = 0;
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY_LOG) || "{}");
      log = d.log || [];
      startTs = d.startTs || null;
    } catch (e) { log = []; startTs = null; }
  }
  function local() {
    try { localStorage.setItem(KEY_LOG, JSON.stringify({ log, startTs })); } catch (e) { }
  }
  function save() {
    local();
    if (ref) {
      lastJson = JSON.stringify({ log, startTs });
      ref.set({ log, startTs }).catch(() => setSync("Ошибка синхронизации"));
    }
  }
  function setSync(t) { $("sync").textContent = t; }

  async function initSync() {
    try {
      const db = await claude.use("db"), user = await claude.use("user");
      if (!db || !user) { setSync("Только это устройство"); return; }
      const id = await user.id();
      if (!id) { setSync("Только это устройство"); return; }
      ref = db.doc("data/users/" + id + "/tracker");
      let first = true;
      ref.onSnapshot(snap => {
        const r = snap.exists ? snap.data() : null;
        if (first) {
          first = false;
          if (r) {
            const m = new Map();
            (r.log || []).concat(log).forEach(x => m.set(x.id, x));
            log = [...m.values()].sort((a, b) => a.start - b.start);
            startTs = r.startTs !== undefined && r.startTs !== null ? r.startTs : startTs;
          }
          save(); render(); loop();
        } else if (r && JSON.stringify({ log: r.log || [], startTs: r.startTs ?? null }) !== lastJson) {
          log = r.log || [];
          startTs = r.startTs ?? null;
          lastJson = JSON.stringify({ log, startTs });
          local(); render(); loop();
        }
        setSync("Синхронизировано");
      }, () => setSync("Только это устройство"));
    } catch (e) { setSync("Только это устройство"); }
  }

  /* ============================== FILTERS ============================== */
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function startOfMonth(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(1); return x; }
  function endOfDay(d) { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; }

  function applyChip(kind) {
    const now = new Date();
    if (kind === "today") {
      filter = { kind, from: startOfDay(now).getTime(), to: endOfDay(now).getTime() };
      $("flt-from").value = dateInputValue(startOfDay(now));
      $("flt-to").value = dateInputValue(endOfDay(now));
    } else if (kind === "month") {
      filter = { kind, from: startOfMonth(now).getTime(), to: endOfDay(now).getTime() };
      $("flt-from").value = dateInputValue(startOfMonth(now));
      $("flt-to").value = dateInputValue(endOfDay(now));
    } else {
      filter = { kind: "all", from: null, to: null };
      $("flt-from").value = "";
      $("flt-to").value = "";
    }
    document.querySelectorAll(".filters .chip").forEach(b => b.classList.toggle("on", b.dataset.range === filter.kind));
    render();
  }

  function dateInputValue(d) {
    return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
  }

  function filteredLog() {
    if (filter.kind === "all" || filter.from === null) return log.slice();
    return log.filter(r => r.start >= filter.from && r.start <= filter.to);
  }

  /* ============================== RENDER ============================== */
  function render() {
    const run = startTs !== null;
    $("toggle").textContent = run ? "Стоп" : "Старт";
    $("toggle").classList.toggle("run", run);
    $("since").textContent = run ? "Начато в " + tm(startTs) : "Нажмите, чтобы начать";
    $("clock").textContent = dur(run ? Date.now() - startTs : 0);
    $("stl").textContent = run ? "Начало" : "Начать с";
    if (document.activeElement !== $("st")) {
      $("st").value = run ? p2(new Date(startTs).getHours()) + ":" + p2(new Date(startTs).getMinutes()) : ($("st").value || "");
    }
    $("clr").hidden = run || !$("st").value;

    const today = dt(Date.now());
    const T1 = normMs();
    const tsum = log.filter(r => dayKey(r.start) === today).reduce((a, r) => a + r.end - r.start, 0);
    const cur = tsum + (run ? Date.now() - startTs : 0);
    tsumLog = tsum;
    ring(cur);
    $("today").innerHTML = "Сегодня: <b>" + dur(cur) + "</b><div id=\"bl\">" +
            (cur < T1 ? "До нормы " + settings.dailyNorm.toFixed(2) + " ч осталось " + dur(T1 - cur) : "Норма дня выполнена") +
            "</div>";

    const mStart = startOfMonth(new Date()).getTime();
    const mEnd = endOfDay(new Date()).getTime();
    const mMs = log.filter(r => r.start >= mStart && r.start <= mEnd).reduce((a, r) => a + r.end - r.start, 0);
    const mNormMs = settings.monthlyNorm * HOUR;
    const pct = Math.min(100, Math.round(mMs / mNormMs * 100));
    $("month-sum").innerHTML =
            `Месяц: <b>${durHours(mMs)}</b> из <b>${settings.monthlyNorm} ч</b> ` +
            (mMs < mNormMs ? `— осталось <b>${durHours(mNormMs - mMs)}</b>` : `— норма выполнена 🎉`) +
            `<div class="mbar"><i style="width:${pct}%"></i></div>`;

    const list = filteredLog();
    const totalMs = list.reduce((a, r) => a + r.end - r.start, 0);
    $("cnt").textContent = list.length ? "Записей: " + list.length + " / " + log.length : "";
    $("total").textContent = list.length ? "Всего: " + dur(totalMs) : "";
    $("clear").hidden = !log.length;

    $("empty").textContent = log.length
            ? (list.length ? "" : "В выбранном периоде записей нет.")
            : "Записей пока нет. Запустите таймер или нажмите «Импорт».";

    const rows = $("rows");
    rows.innerHTML = "";
    const cc = calc();
    const T = { d: 0, a: 0, b: 0, c: 0 };
    list.forEach((r, i) => {
      const c = cc[r.id] || { d: r.end - r.start, a: 0, b: 0, c: 0 };
      T.d += c.d; T.a += c.a; T.b += c.b; T.c += c.c;
      const tr = document.createElement("tr");
      const vals = [i + 1, dt(r.start), tm(r.start), tm(r.end), z(c.a), z(c.b), z(c.c)];
      vals.forEach((v, k) => {
        const td = document.createElement("td");
        td.textContent = v;
        if (k === 4) td.className = "c100";
        if (k === 5) td.className = "c125";
        if (k === 6) td.className = "c150";
        tr.appendChild(td);
      });
      const td = document.createElement("td");
      td.className = "row-btns";
      const bEdit = document.createElement("button");
      bEdit.className = "edit"; bEdit.textContent = "✎"; bEdit.title = "Редактировать";
      bEdit.onclick = () => openEdit(r.id);
      const bDel = document.createElement("button");
      bDel.className = "del"; bDel.textContent = "×"; bDel.title = "Удалить";
      bDel.onclick = () => {
        if (!confirm("Удалить запись " + dt(r.start) + " " + tm(r.start) + "—" + tm(r.end) + "?")) return;
        log = log.filter(x => x.id !== r.id); save(); render();
      };
      td.appendChild(bEdit); td.appendChild(bDel);
      tr.appendChild(td);
      rows.appendChild(tr);
    });

    const ft = $("foot");
    ft.innerHTML = "";
    if (list.length) {
      const tr = document.createElement("tr");
      ["", "Итого", "", "", z(T.a), z(T.b), z(T.c), ""].forEach(v => {
        const td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
      });
      ft.appendChild(tr);
    }

    drawHeatmap();
  }

  /* ============================== HEATMAP ============================== */
  function drawHeatmap() {
    const grid = $("heat-grid");
    grid.innerHTML = "";
    const weeks = 26;
    const today = startOfDay(new Date());
    const end = new Date(today);
    const dayEnd = end.getDay();
    end.setDate(end.getDate() + (6 - dayEnd));
    const start = new Date(end);
    start.setDate(start.getDate() - (weeks * 7 - 1));

    const perDay = {};
    log.forEach(r => {
      const k = dayKey(r.start);
      perDay[k] = (perDay[k] || 0) + (r.end - r.start);
    });

    const T1 = normMs();
    const T2 = norm125Ms();
    const todayKey = dt(today.getTime());
    const frag = document.createDocumentFragment();
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      const cell = document.createElement("div");
      cell.className = "heat-cell";
      const k = dt(d.getTime());
      const ms = perDay[k] || 0;
      let lvl = 0;
      if (ms > 0) {
        if (ms < T1 * 0.5) lvl = 1;
        else if (ms < T1) lvl = 2;
        else if (ms < T2) lvl = 3;
        else if (ms < T2 + 2 * HOUR) lvl = 4;
        else lvl = 5;
      }
      cell.classList.add("h" + lvl);
      if (k === todayKey) cell.classList.add("today");
      cell.title = k + ": " + durHours(ms);
      cell.onclick = () => {
        const from = startOfDay(d).getTime();
        const to = endOfDay(d).getTime();
        filter = { kind: "custom", from, to };
        $("flt-from").value = dateInputValue(new Date(from));
        $("flt-to").value = dateInputValue(new Date(to));
        document.querySelectorAll(".filters .chip").forEach(b => b.classList.remove("on"));
        render();
        $("tbl").scrollIntoView({ behavior: "smooth", block: "start" });
      };
      frag.appendChild(cell);
    }
    grid.appendChild(frag);
    $("heat-range").textContent = dt(start.getTime()) + " — " + dt(end.getTime());
  }

  /* ============================== TIMER LOOP ============================== */
  let raf = null;
  function frame() {
    if (startTs === null) { raf = null; return; }
    const f = ((Date.now() - startTs) % 60000) / 60000, a = f * 2 * Math.PI;
    $("sw").style.strokeDasharray = (f * 100) + " " + (100 - f * 100);
    const d = $("dot");
    d.setAttribute("cx", (100 + 98 * Math.cos(a)).toFixed(2));
    d.setAttribute("cy", (100 + 98 * Math.sin(a)).toFixed(2));
    d.setAttribute("opacity", "1");
    raf = requestAnimationFrame(frame);
  }
  function loop() {
    document.body.classList.toggle("running", startTs !== null);
    if (startTs === null) { $("sw").style.strokeDasharray = "0 100"; $("dot").setAttribute("opacity", "0"); }
    else if (!raf) raf = requestAnimationFrame(frame);
    clearInterval(tick);
    if (startTs !== null) tick = setInterval(() => {
      $("clock").textContent = dur(Date.now() - startTs);
      ring(tsumLog + Date.now() - startTs);
      if (Date.now() % 5000 < 260) render();
    }, 250);
  }

  /* ============================== TABS ============================== */
  function tab(n) {
    ["t", "h", "m"].forEach(k => {
      const el = $(k + "-screen"), btn = $("n-" + k);
      if (el) el.hidden = k !== n;
      if (btn) btn.classList.toggle("on", k === n);
    });
  }

  /* ============================== MANUAL ============================== */
  function manual() {
    const d = $("md").value, a = $("ms").value, b = $("me").value;
    if (!d || !a || !b) return null;
    const [y, mo, da] = d.split("-").map(Number);
    const st = new Date(y, mo - 1, da, +a.slice(0, 2), +a.slice(3, 5), 0, 0).getTime();
    let en = new Date(y, mo - 1, da, +b.slice(0, 2), +b.slice(3, 5), 0, 0).getTime(), next = false;
    if (en <= st) { en += 864e5; next = true; }
    return { id: Date.now() + Math.floor(Math.random() * 1000), start: st, end: en, next };
  }

  function preview() {
    const r = manual();
    if (!r) { $("pv").textContent = "Введите число, начало и конец"; $("add").disabled = true; return; }
    const keep = log; log = log.concat([r]); const c = calc()[r.id]; log = keep;
    $("pv").innerHTML = "Длительность: <b>" + dur(c.d) + "</b>" + (r.next ? " (конец на следующий день)" : "") +
            "<br>100%: " + z(c.a) + " · 125%: " + z(c.b) + " · 150%: " + z(c.c);
    $("add").disabled = false;
  }

  /* ============================== EDIT ============================== */
  let editId = null;

  function openEdit(id) {
    const r = log.find(x => x.id === id);
    if (!r) return;
    editId = id;
    $("ed-date").value = dateInputValue(new Date(r.start));
    $("ed-start").value = tmv(r.start);
    $("ed-end").value = tmv(r.end);
    $("edit-modal").hidden = false;
  }

  function saveEdit() {
    const r = log.find(x => x.id === editId);
    if (!r) { $("edit-modal").hidden = true; return; }
    const d = $("ed-date").value, a = $("ed-start").value, b = $("ed-end").value;
    if (!d || !a || !b) { alert("Заполните дату, начало и конец"); return; }
    const [y, mo, da] = d.split("-").map(Number);
    const st = new Date(y, mo - 1, da, +a.slice(0, 2), +a.slice(3, 5), 0, 0).getTime();
    let en = new Date(y, mo - 1, da, +b.slice(0, 2), +b.slice(3, 5), 0, 0).getTime();
    if (en <= st) en += 864e5;
    r.start = st; r.end = en;
    log.sort((x, y) => x.start - y.start);
    save(); render();
    $("edit-modal").hidden = true;
  }

  /* ============================== EXPORT ============================== */
  function buildMonthList() {
    const set = new Set();
    log.forEach(r => {
      const d = new Date(r.start);
      set.add(d.getFullYear() + "-" + p2(d.getMonth() + 1));
    });
    const arr = [...set].sort().reverse();
    const sel = $("exp-month");
    sel.innerHTML = "";
    if (!arr.length) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "Нет данных";
      sel.appendChild(opt);
      return;
    }
    arr.forEach(key => {
      const [y, m] = key.split("-").map(Number);
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = MONTH_NAMES[m - 1] + " " + y;
      sel.appendChild(opt);
    });
  }

  function openExportModal() {
    if (!log.length) { alert("Нет записей для экспорта"); return; }
    buildMonthList();
    $("export-modal").hidden = false;
  }
  function closeExportModal() { $("export-modal").hidden = true; }

  function exportList() {
    const v = document.querySelector('input[name="exp-range"]:checked').value;
    if (v === "month") {
      const key = $("exp-month").value;
      if (!key) { alert("Выберите месяц"); return null; }
      const [y, m] = key.split("-").map(Number);
      const from = new Date(y, m - 1, 1, 0, 0, 0, 0).getTime();
      const to = new Date(y, m, 0, 23, 59, 59, 999).getTime();
      return log.filter(r => r.start >= from && r.start <= to);
    }
    return log.slice();
  }

  async function exportXlsx() {
    const list = exportList();
    if (list === null) return;
    if (!list.length) { alert("В выбранном периоде нет записей"); return; }
    if (typeof XLSX === "undefined") { alert("Не удалось загрузить Excel-модуль"); return; }

    const cc = calc();
    const tot = { d: 0, a: 0, b: 0, c: 0 };

    const aoa = [];
    aoa.push(["Учёт рабочего времени"]);
    aoa.push(["Период:", dt(list[0].start) + " — " + dt(list[list.length - 1].start)]);
    aoa.push(["Сформировано:", new Date().toLocaleString("ru-RU")]);
    aoa.push(["Норма дня, ч:", settings.dailyNorm]);
    aoa.push(["Норма месяца, ч:", settings.monthlyNorm]);
    aoa.push([]);
    aoa.push(["№", "Число", "Начало", "Конец", "100%", "125%", "150%"]);
    const headerRowIdx = aoa.length - 1;
    list.forEach((r, i) => {
      const c = cc[r.id] || { d: r.end - r.start, a: 0, b: 0, c: 0 };
      tot.d += c.d; tot.a += c.a; tot.b += c.b; tot.c += c.c;
      aoa.push([
        i + 1,
        dt(r.start),
        tmv(r.start),
        tmv(r.end),
        +(c.a / HOUR).toFixed(2),
        +(c.b / HOUR).toFixed(2),
        +(c.c / HOUR).toFixed(2)
      ]);
    });
    const totalRowIdx = aoa.length;
    aoa.push([
      "", "Итого", "", "",
      +(tot.a / HOUR).toFixed(2),
      +(tot.b / HOUR).toFixed(2),
      +(tot.c / HOUR).toFixed(2)
    ]);

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [
      { wch: 5 }, { wch: 12 }, { wch: 10 }, { wch: 10 },
      { wch: 10 }, { wch: 10 }, { wch: 10 }
    ];
    ws["!rows"] = [];
    ws["!rows"][headerRowIdx] = { hpt: 22 };
    ws["!rows"][totalRowIdx] = { hpt: 22 };
    ws["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } },
      { s: { r: 1, c: 1 }, e: { r: 1, c: 6 } },
      { s: { r: 2, c: 1 }, e: { r: 2, c: 6 } },
      { s: { r: 3, c: 1 }, e: { r: 3, c: 6 } },
      { s: { r: 4, c: 1 }, e: { r: 4, c: 6 } },
      { s: { r: totalRowIdx, c: 0 }, e: { r: totalRowIdx, c: 2 } },
    ];

    const titleCell = ws[XLSX.utils.encode_cell({ r: 0, c: 0 })];
    if (titleCell) titleCell.s = { font: { bold: true, sz: 14 } };

    for (let c = 0; c < 7; c++) {
      const ref = XLSX.utils.encode_cell({ r: headerRowIdx, c });
      if (ws[ref]) ws[ref].s = {
        font: { bold: true, color: { rgb: "FFFFFF" } },
        fill: { fgColor: { rgb: "1F7A4D" } },
        alignment: { horizontal: "center", vertical: "center" }
      };
    }
    for (let c = 0; c < 7; c++) {
      const ref = XLSX.utils.encode_cell({ r: totalRowIdx, c });
      if (ws[ref]) ws[ref].s = {
        font: { bold: true, color: { rgb: "16211B" } },
        fill: { fgColor: { rgb: "D9EFE0" } },
        alignment: { horizontal: "center", vertical: "center" }
      };
    }

    for (let i = 0; i < list.length; i++) {
      const r = headerRowIdx + 1 + i;
      [4, 5, 6].forEach(col => {
        const ref = XLSX.utils.encode_cell({ r, c: col });
        if (ws[ref]) {
          ws[ref].t = "n";
          ws[ref].z = "0.00";
          if (col === 5 && ws[ref].v > 0) ws[ref].s = { font: { color: { rgb: "B7791F" } } };
          if (col === 6 && ws[ref].v > 0) ws[ref].s = { font: { color: { rgb: "C23B2E" } } };
        }
      });
    }

    ws["!freeze"] = { xSplit: "0", ySplit: String(headerRowIdx + 1) };

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Время");

    const name = "uchet-vremeni.xlsx";
    const P = window.Capacitor && Capacitor.Plugins;
    if (P && P.Filesystem && P.Share) {
      const b64 = XLSX.write(wb, { bookType: "xlsx", type: "base64", cellStyles: true });
      await P.Filesystem.writeFile({ path: name, data: b64, directory: "CACHE" });
      const u = await P.Filesystem.getUri({ path: name, directory: "CACHE" });
      await P.Share.share({ title: "Учёт времени", url: u.uri });
    } else {
      XLSX.writeFile(wb, name, { cellStyles: true });
    }
    closeExportModal();
  }

  async function exportJson() {
    const list = exportList();
    if (list === null) return;
    if (!list.length) { alert("В выбранном периоде нет записей"); return; }
    const name = "uchet-vremeni-backup.json";
    const jsonStr = JSON.stringify({ version: 1, exportedAt: Date.now(), settings, log: list }, null, 2);
    const P = window.Capacitor && Capacitor.Plugins;
    if (P && P.Filesystem && P.Share) {
      const bytes = new TextEncoder().encode(jsonStr);
      let bin = ""; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      const b64 = btoa(bin);
      await P.Filesystem.writeFile({ path: name, data: b64, directory: "CACHE" });
      const u = await P.Filesystem.getUri({ path: name, directory: "CACHE" });
      await P.Share.share({ title: "Резервная копия", url: u.uri });
    } else {
      const blob = new Blob([jsonStr], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    closeExportModal();
  }

  async function exportCsv() {
    const list = exportList();
    if (list === null) return;
    if (!list.length) { alert("В выбранном периоде нет записей"); return; }
    const cc = calc();
    const lines = [["№", "Число", "Начало", "Конец", "100%", "125%", "150%"].join(",")];
    list.forEach((r, i) => {
      const c = cc[r.id] || { d: r.end - r.start, a: 0, b: 0, c: 0 };
      lines.push([
        i + 1, dt(r.start), tmv(r.start), tmv(r.end),
        (c.a / HOUR).toFixed(2), (c.b / HOUR).toFixed(2), (c.c / HOUR).toFixed(2)
      ].join(","));
    });
    const text = lines.join("\n");
    try {
      await navigator.clipboard.writeText(text);
      alert("CSV скопирован. Открой Google Таблицы и вставь (Ctrl+V / ⌘V).");
    } catch (e) {
      alert("Не удалось скопировать. Вот данные:\n\n" + text);
    }
    closeExportModal();
  }

  /* ============================== IMPORT ============================== */
  $("btn-import").onclick = () => { $("file-import").value = ""; $("file-import").click(); buzz(); };
  $("file-import").onchange = e => { const f = e.target.files && e.target.files[0]; if (f) handleFileImport(f); };

  function parseDateCell(val) {
    if (val === undefined || val === null || val === "") return null;
    if (val instanceof Date) return { y: val.getFullYear(), m: val.getMonth(), d: val.getDate() };
    if (typeof val === "number" && typeof XLSX !== "undefined" && XLSX.SSF) {
      const p = XLSX.SSF.parse_date_code(val);
      if (p && p.y >= 2000) return { y: p.y, m: p.m - 1, d: p.d };
    }
    const s = String(val).trim();
    const m1 = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
    if (m1) { const yr = +m1[3] < 100 ? 2000 + Number(m1[3]) : +m1[3]; return { y: yr, m: +m1[2] - 1, d: +m1[1] }; }
    const m2 = s.match(/^(\d{4})[./-](\d{1,2})[./-](\d{1,2})$/);
    if (m2) return { y: +m2[1], m: +m2[2] - 1, d: +m2[3] };
    return null;
  }
  function parseTimeCell(val) {
    if (val === undefined || val === null || val === "") return null;
    if (val instanceof Date) return { h: val.getHours(), m: val.getMinutes(), s: val.getSeconds() };
    if (typeof val === "number" && typeof XLSX !== "undefined" && XLSX.SSF) {
      const p = XLSX.SSF.parse_date_code(val);
      if (p) return { h: p.H, m: p.M, s: p.S };
    }
    const s = String(val).trim();
    const m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (m) return { h: +m[1], m: +m[2], s: m[3] ? +m[3] : 0 };
    return null;
  }
  function parseExcelRows(rawRows) {
    if (!rawRows || !rawRows.length) return [];
    let dateCol = -1, startCol = -1, endCol = -1, startRow = 0;
    for (let r = 0; r < Math.min(10, rawRows.length); r++) {
      const row = rawRows[r] || [];
      for (let c = 0; c < row.length; c++) {
        const cell = String(row[c] || "").toLowerCase().trim();
        if (cell.includes("числ") || cell.includes("дат") || cell === "date") dateCol = c;
        if (cell.includes("нач") || cell.includes("старт") || cell === "start") startCol = c;
        if (cell.includes("кон") || cell.includes("стоп") || cell === "end") endCol = c;
      }
      if (dateCol !== -1 && startCol !== -1 && endCol !== -1) { startRow = r + 1; break; }
    }
    if (dateCol === -1) dateCol = 1;
    if (startCol === -1) startCol = 2;
    if (endCol === -1) endCol = 3;
    const result = [];
    for (let r = startRow; r < rawRows.length; r++) {
      const row = rawRows[r] || [];
      const rowText = row.join(" ").toLowerCase();
      if (rowText.includes("итого") || rowText.includes("всего") || rowText.includes("total")) continue;
      const dObj = parseDateCell(row[dateCol]);
      const sObj = parseTimeCell(row[startCol]);
      const eObj = parseTimeCell(row[endCol]);
      if (!dObj || !sObj || !eObj) continue;
      const startTs = new Date(dObj.y, dObj.m, dObj.d, sObj.h, sObj.m, sObj.s).getTime();
      let endTs = new Date(dObj.y, dObj.m, dObj.d, eObj.h, eObj.m, eObj.s).getTime();
      if (endTs <= startTs) endTs += 86400000;
      result.push({ id: startTs, start: startTs, end: endTs });
    }
    return result;
  }

  function handleFileImport(file) {
    if (!file) return;
    const isJson = file.name.toLowerCase().endsWith(".json");
    const reader = new FileReader();
    if (isJson) {
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.log) ? parsed.log : []);
          const valid = list.filter(x => x && x.start && x.end && x.end > x.start).map(x => ({
            id: x.id || x.start, start: +x.start, end: +x.end
          }));
          if (parsed && parsed.settings) {
            const s = parsed.settings;
            settings = {
              dailyNorm: parseFloat(s.dailyNorm) > 0 ? parseFloat(s.dailyNorm) : DEFAULT_SETTINGS.dailyNorm,
              monthlyNorm: parseFloat(s.monthlyNorm) > 0 ? parseFloat(s.monthlyNorm) : DEFAULT_SETTINGS.monthlyNorm
            };
            saveSettings();
          }
          showImportModal(file.name, valid);
        } catch (err) { alert("Ошибка чтения JSON: " + err.message); }
      };
      reader.readAsText(file);
    } else {
      reader.onload = e => {
        try {
          if (typeof XLSX === "undefined") { alert("Модуль Excel не загружен"); return; }
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
          const valid = parseExcelRows(rawRows);
          showImportModal(file.name, valid);
        } catch (err) { alert("Ошибка чтения Excel: " + err.message); }
      };
      reader.readAsArrayBuffer(file);
    }
  }

  function showImportModal(fileName, records) {
    if (!records.length) {
      alert("В файле «" + fileName + "» не найдено записей. Проверьте столбцы «Число», «Начало», «Конец».");
      return;
    }
    pendingImport = records.sort((a, b) => a.start - b.start);
    const totalMs = pendingImport.reduce((acc, r) => acc + (r.end - r.start), 0);
    const firstD = dt(pendingImport[0].start), lastD = dt(pendingImport[pendingImport.length - 1].start);
    $("import-summary").innerHTML =
            `<b>Файл:</b> ${fileName}<br>` +
            `<b>Найдено смен:</b> ${pendingImport.length}<br>` +
            `<b>Период:</b> ${firstD} — ${lastD}<br>` +
            `<b>Суммарно:</b> ${dur(totalMs)}<br>` +
            `<span style="color:var(--mute)">Текущих записей: ${log.length}</span>`;
    $("import-modal").hidden = false;
    buzz();
  }

  /* ============================== AUTOBACKUP ============================== */
  async function tryAutoBackup() {
    if (!window.showDirectoryPicker) return;
    const last = +localStorage.getItem(KEY_BACKUP) || 0;
    const week = 7 * 24 * 60 * 60 * 1000;
    if (Date.now() - last < week) return;
    if (!log.length) return;

    const ok = confirm("Прошла неделя с последнего бэкапа. Сохранить резервную копию в папку?");
    if (!ok) { localStorage.setItem(KEY_BACKUP, String(Date.now())); return; }
    try {
      const dir = await window.showDirectoryPicker({ mode: "readwrite" });
      const name = "uchet-vremeni-" + new Date().toISOString().slice(0, 10) + ".json";
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify({ version: 1, exportedAt: Date.now(), settings, log }, null, 2));
      await w.close();
      localStorage.setItem(KEY_BACKUP, String(Date.now()));
      alert("Бэкап сохранён: " + name);
    } catch (e) {}
  }

  /* ============================== EVENTS ============================== */
  $("toggle").onclick = () => {
    buzz();
    if (startTs === null) {
      const v = $("st").value;
      let t = Date.now();
      if (v) {
        const d = new Date();
        d.setHours(+v.slice(0, 2), +v.slice(3, 5), 0, 0);
        if (d.getTime() > t) { alert("Время начала не может быть позже текущего"); return; }
        t = d.getTime();
      }
      startTs = t; $("st").value = "";
    } else {
      const end = Date.now();
      log.push({ id: end + Math.floor(Math.random() * 1000), start: startTs, end });
      startTs = null;
    }
    save(); render(); loop();
  };

  $("st").onchange = () => {
    const v = $("st").value;
    if (startTs === null) { render(); return; }
    if (!v) { render(); return; }
    const d = new Date(startTs);
    d.setHours(+v.slice(0, 2), +v.slice(3, 5), 0, 0);
    if (d.getTime() > Date.now()) { alert("Время начала не может быть позже текущего"); render(); return; }
    startTs = d.getTime(); save(); render(); loop();
  };

  $("clr").onclick = () => { $("st").value = ""; render(); };
  $("n-t").onclick = () => tab("t");
  $("n-h").onclick = () => tab("h");
  $("n-m").onclick = () => {
    if (!$("md").value) { const n = new Date(); $("md").value = n.getFullYear() + "-" + p2(n.getMonth() + 1) + "-" + p2(n.getDate()); }
    tab("m"); preview();
  };
  ["md", "ms", "me"].forEach(i => $(i).oninput = preview);

  $("add").onclick = () => {
    const r = manual(); if (!r) return;
    log.push({ id: r.id, start: r.start, end: r.end });
    log.sort((x, y) => x.start - y.start);
    $("ms").value = ""; $("me").value = "";
    save(); render(); preview(); tab("h"); buzz();
  };

  $("clear").onclick = () => {
    if (confirm("Удалить все записи без возможности отмены?")) {
      log = []; save(); render();
    }
  };

  document.querySelectorAll(".filters .chip").forEach(b => {
    b.onclick = () => applyChip(b.dataset.range);
  });
  $("flt-from").onchange = $("flt-to").onchange = () => {
    const f = $("flt-from").value, t = $("flt-to").value;
    if (!f || !t) { applyChip("all"); return; }
    filter = {
      kind: "custom",
      from: new Date(f + "T00:00:00").getTime(),
      to: new Date(t + "T23:59:59").getTime()
    };
    document.querySelectorAll(".filters .chip").forEach(b => b.classList.remove("on"));
    render();
  };

  $("btn-settings").onclick = () => {
    $("cfg-daily").value = settings.dailyNorm;
    $("cfg-monthly").value = settings.monthlyNorm;
    $("settings-modal").hidden = false;
  };
  $("settings-close").onclick = $("settings-cancel").onclick = () => { $("settings-modal").hidden = true; };
  $("settings-save").onclick = () => {
    const d = parseFloat($("cfg-daily").value);
    const m = parseFloat($("cfg-monthly").value);
    if (!(d > 0 && d <= 24)) { alert("Норма дня должна быть 0–24 ч"); return; }
    if (!(m > 0 && m <= 1000)) { alert("Норма месяца должна быть 0–1000 ч"); return; }
    settings.dailyNorm = d;
    settings.monthlyNorm = m;
    saveSettings();
    $("settings-modal").hidden = true;
    render();
  };

  $("edit-close").onclick = $("edit-cancel").onclick = () => { $("edit-modal").hidden = true; };
  $("edit-save").onclick = saveEdit;

  $("btn-export").onclick = openExportModal;
  $("export-close").onclick = $("export-cancel").onclick = closeExportModal;
  document.querySelectorAll('input[name="exp-range"]').forEach(r => {
    r.onchange = () => {
      const v = document.querySelector('input[name="exp-range"]:checked').value;
      $("exp-month-wrap").hidden = v !== "month";
    };
  });
  $("export-xlsx-btn").onclick = exportXlsx;
  $("export-json-btn").onclick = exportJson;
  $("export-csv-btn").onclick = exportCsv;

  $("import-close").onclick = $("import-cancel").onclick = () => { $("import-modal").hidden = true; pendingImport = []; };
  $("import-apply").onclick = () => {
    if (!pendingImport || !pendingImport.length) return;
    const mode = document.querySelector('input[name="import-mode"]:checked')?.value || "merge";
    let count = 0;
    if (mode === "replace") { log = pendingImport.slice(); count = log.length; }
    else {
      const existing = new Set(log.map(r => r.start));
      const toAdd = pendingImport.filter(r => !existing.has(r.start));
      log = log.concat(toAdd).sort((a, b) => a.start - b.start);
      count = toAdd.length;
    }
    save(); render();
    $("import-modal").hidden = true; buzz();
    alert(`Импортировано смен: ${count} (всего: ${log.length})`);
    pendingImport = [];
  };

  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  /* ============================== INIT ============================== */
  loadSettings();
  load();
  render();
  loop();
  setSync("Хранится на телефоне");
  applyChip("all");
  initSync();
  setTimeout(tryAutoBackup, 2000);
</script>
</body>
</html>
